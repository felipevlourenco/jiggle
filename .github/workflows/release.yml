# Push a tag like v0.1.1 (it must match package.json's version) to build, sign and notarize an
# Apple silicon build and create a DRAFT GitHub release. Publishing the draft is what makes the update go live.
#
# Secrets: CSC_LINK (base64 of the signing certificate .p12), CSC_KEY_PASSWORD.
#   Until you have a Developer ID Application certificate, export your "Apple Development" one. The app is then
#   signed but NOT notarized (people use System Settings > Privacy & Security > Open Anyway, and auto-update
#   will not install).
#   For a proper release, also add APPLE_API_KEY_P8 (contents of the App Store Connect API key .p8),
#   APPLE_API_KEY_ID and APPLE_API_ISSUER, and swap CSC_LINK for the Developer ID certificate:
#   the build then notarizes by itself.
name: release
on:
  push:
    tags: ['v*']

# No token scopes by default; each job asks for what it needs.
permissions: {}

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { arch: arm64, runner: macos-latest }
          # Intel is off for now. To bring it back, add { arch: x64, runner: macos-15-intel } here and use
          # scripts/merge-latest-mac.mjs in the release job (see below).
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, package-manager-cache: false }
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with: { enable-cache: false }
      - run: pnpm install --frozen-lockfile
      - run: uv sync --python 3.12 --group dev
        working-directory: sidecar
      - run: pnpm typecheck && pnpm lint && pnpm test
      - run: .venv/bin/python -m pytest
        working-directory: sidecar
      # Freezes the engine for this runner's architecture into resources/sidecar/<arch>.
      - run: bash sidecar/build.sh
      - name: Build and sign (and notarize, when the Apple API key is set)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          pnpm exec electron-vite build
          if [ -n "$APPLE_API_KEY_ID" ]; then
            echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/key.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/key.p8"
            pnpm exec electron-builder --mac --${{ matrix.arch }} --publish never
            rm "$RUNNER_TEMP/key.p8"
            echo "NOTARIZED=1" >> "$GITHUB_ENV"
          else
            # Development certificate: sign only. Replace with the Developer ID certificate when you have it.
            pnpm exec electron-builder --mac --${{ matrix.arch }} --publish never \
              -c.mac.notarize=false -c.mac.type=development
          fi
      - name: Verify signature (and Gatekeeper, when notarized)
        run: |
          APP=$(ls -d dist/mac*/Jiggle.app)
          codesign --verify --deep --strict --verbose=2 "$APP"
          if [ "$NOTARIZED" = "1" ]; then spctl -a -vv "$APP"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jiggle-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: artifacts }
      # With more than one arch, each runner writes its own latest-mac.yml and the updater needs one listing all:
      #   node scripts/merge-latest-mac.mjs artifacts/jiggle-arm64/latest-mac.yml artifacts/jiggle-x64/latest-mac.yml > release/latest-mac.yml
      - run: |
          mkdir release
          cp artifacts/*/*.dmg artifacts/*/*.zip artifacts/*/*.blockmap artifacts/*/latest-mac.yml release/
      - run: gh release create "$GITHUB_REF_NAME" release/* --draft --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
