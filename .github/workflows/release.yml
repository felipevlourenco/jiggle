# Push a tag like v0.1.1 (it must match package.json's version) to build, sign and notarize the Apple silicon
# and Intel builds and the unsigned Windows and Linux betas, and create a DRAFT GitHub release. Publishing the
# draft is what makes the update go live.
# "Run workflow" on the Actions tab does the same builds as a test: they are kept as artifacts, with no release.
#
# Secrets: CSC_LINK (base64 of the signing certificate .p12), CSC_KEY_PASSWORD.
#   Until you have a Developer ID Application certificate, export your "Apple Development" one. The app is then
#   signed but NOT notarized (people use System Settings > Privacy & Security > Open Anyway, and auto-update
#   will not install).
#   For a proper release, also add APPLE_API_KEY_P8 (contents of the App Store Connect API key .p8),
#   APPLE_API_KEY_ID and APPLE_API_ISSUER, and swap CSC_LINK for the Developer ID certificate:
#   the build then notarizes by itself.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# No token scopes by default; each job asks for what it needs.
permissions: {}

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { arch: arm64, runner: macos-latest }
          - { arch: x64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Tag matches package.json
        if: github.ref_type == 'tag'
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, package-manager-cache: false }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: { enable-cache: false }
      - run: pnpm install --frozen-lockfile
      - run: uv sync --python 3.12 --group dev
        working-directory: sidecar
      - run: pnpm typecheck && pnpm lint && pnpm test
      - run: .venv/bin/python -m pytest
        working-directory: sidecar
      # Freezes the engine for this runner's architecture into resources/sidecar/<arch>.
      - run: bash sidecar/build.sh
      - name: Build and sign (and notarize, when the Apple API key is set)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          pnpm exec electron-vite build
          if [ -n "$APPLE_API_KEY_ID" ]; then
            echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/key.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/key.p8"
            pnpm exec electron-builder --mac --${{ matrix.arch }} --publish never
            rm "$RUNNER_TEMP/key.p8"
            echo "NOTARIZED=1" >> "$GITHUB_ENV"
          else
            # Development certificate: sign only. Replace with the Developer ID certificate when you have it.
            pnpm exec electron-builder --mac --${{ matrix.arch }} --publish never \
              -c.mac.notarize=false -c.mac.type=development
          fi
      - name: Verify signature (and Gatekeeper, when notarized)
        run: |
          APP=$(ls -d dist/mac*/Jiggle.app)
          codesign --verify --deep --strict --verbose=2 "$APP"
          if [ "$NOTARIZED" = "1" ]; then spctl -a -vv "$APP"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jiggle-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml

  # The Windows and Linux betas are unsigned, so they get none of the signing secrets.
  beta:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { system: windows, runner: windows-latest, flag: --win, engine: jiggle_engine.exe }
          # Pinned, not -latest: a frozen engine may not run on a Linux older than the one that built it.
          - { system: linux, runner: ubuntu-24.04, flag: --linux, engine: jiggle_engine }
    runs-on: ${{ matrix.runner }}
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Tag matches package.json
        if: github.ref_type == 'tag'
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, package-manager-cache: false }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: { enable-cache: false }
      - run: pnpm install --frozen-lockfile
      - run: uv sync --python 3.12 --group dev
        working-directory: sidecar
      - run: pnpm typecheck && pnpm lint && pnpm test
      - run: uv run --no-sync python -m pytest
        working-directory: sidecar
      - run: bash sidecar/build.sh
      - run: bash sidecar/check-engine.sh resources/sidecar/x64/jiggle_engine/${{ matrix.engine }}
      - name: Build the package
        run: |
          pnpm exec electron-vite build
          pnpm exec electron-builder ${{ matrix.flag }} --x64 --publish never
      # As a person would run it: nothing about the system's sandbox settings is changed first.
      - name: The AppImage starts, with its engine
        if: matrix.system == 'linux'
        run: bash scripts/check-appimage.sh dist/*.AppImage
        timeout-minutes: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jiggle-${{ matrix.system }}
          path: |
            dist/*-setup.exe
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml

  release:
    if: github.ref_type == 'tag'
    needs: [build, beta]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: artifacts }
      # Each runner writes a latest-mac.yml listing only its own files, and the updater reads one: join them.
      - run: |
          mkdir release
          cp artifacts/*/*.dmg artifacts/*/*.zip artifacts/*/*.blockmap release/
          cp artifacts/jiggle-windows/*-setup.exe artifacts/jiggle-windows/latest.yml release/
          cp artifacts/jiggle-linux/*.AppImage artifacts/jiggle-linux/latest-linux.yml release/
          node scripts/merge-latest-mac.mjs artifacts/jiggle-arm64/latest-mac.yml artifacts/jiggle-x64/latest-mac.yml > release/latest-mac.yml
      - run: gh release create "$GITHUB_REF_NAME" release/* --draft --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
